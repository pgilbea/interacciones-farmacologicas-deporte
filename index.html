<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fármacos y ejercicio · Farmacología CAFyD · UPNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F7; --card:#FFFFFF; --ink:#132433; --muted:#566676; --line:#D6DEE5; --soft:#E8EEF2; --skin:#DCE4EA; --skin2:#C9D4DD;
  --sna:#6B7C12; --snc:#A97F00; --dolor:#C9561A; --cv:#B8322A; --resp:#0F7F86; --dig:#83386C; --f:#2C5A8C;
  --ok:#2E7D32; --limite:#B07A00; --comp:#D9620B; --deporte:#1F5F8B; --siempre:#B3261E;
  --c:var(--ink);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1820; --card:#16212B; --ink:#E6EDF2; --muted:#A1B0BD; --line:#2A3946; --soft:#1E2B36; --skin:#25333F; --skin2:#30414F;
  --sna:#A9BC42; --snc:#E1B53F; --dolor:#F08A4B; --cv:#EE6B60; --resp:#3FC1C7; --dig:#CD7AB4; --f:#79A7DD;
  --ok:#69C16E; --limite:#E3B23C; --comp:#F59A4E; --deporte:#6FA8DC; --siempre:#F07468; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1820; --card:#16212B; --ink:#E6EDF2; --muted:#A1B0BD; --line:#2A3946; --soft:#1E2B36; --skin:#25333F; --skin2:#30414F;
  --sna:#A9BC42; --snc:#E1B53F; --dolor:#F08A4B; --cv:#EE6B60; --resp:#3FC1C7; --dig:#CD7AB4; --f:#79A7DD;
  --ok:#69C16E; --limite:#E3B23C; --comp:#F59A4E; --deporte:#6FA8DC; --siempre:#F07468; color-scheme:dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55; }
a{ color:inherit; } button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--f); outline-offset:2px; border-radius:6px; }
h1,h2,h3{ font-family:var(--display); letter-spacing:.005em; line-height:1.05; }

/* barra superior */
header.top{ position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); margin-top:calc(-1 * env(safe-area-inset-top,0px)); }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:21; background:var(--card); }
.topin{ max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:18px; padding:10px 20px; flex-wrap:wrap; }
.logo{ text-decoration:none; display:flex; align-items:baseline; gap:8px; margin-right:auto; }
.logo b{ font-family:var(--display); font-size:1.55rem; font-weight:800; }
.logo span{ color:var(--muted); font-size:.9rem; }
nav.main{ display:flex; gap:4px; flex-wrap:wrap; }
nav.main a{ text-decoration:none; padding:7px 12px; border-radius:8px; font-weight:600; font-size:.95rem; }
nav.main a:hover{ background:var(--soft); }
nav.main a[aria-current="page"]{ background:var(--ink); color:var(--card); }
main{ max-width:1180px; margin:0 auto; padding:24px 20px 80px; }

/* portada con el cuerpo */
.hero{ display:grid; grid-template-columns:minmax(300px,440px) minmax(0,1fr); gap:34px; align-items:start; }
.bodycard{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 10px 6px; position:sticky; top:84px; }
.bodycard svg{ width:100%; height:auto; display:block; max-height:calc(100vh - 130px); }
.hot{ cursor:pointer; transition:opacity .15s; }
.hot .o{ transition:filter .15s, transform .15s; transform-box:fill-box; transform-origin:center; }
.hot:hover .o, .hot:focus .o, .hot.on .o{ filter:brightness(1.12) drop-shadow(0 0 6px rgba(0,0,0,.25)); }
svg.dim .hot:not(.on){ opacity:.35; }
.hot:focus{ outline:none; }
.hero h1{ font-size:clamp(2.6rem,6vw,4.3rem); font-weight:800; margin:4px 0 12px; text-transform:none; }
.hero .lead{ font-size:1.12rem; color:var(--muted); max-width:58ch; margin:0 0 20px; }
.peek{ background:var(--card); border:1px solid var(--line); border-left:8px solid var(--c); border-radius:12px; padding:14px 18px; min-height:132px; margin-bottom:18px; }
.peek h2{ font-size:1.7rem; margin:0 0 4px; color:var(--c); }
.peek p{ margin:4px 0 0; color:var(--muted); }
.syslist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin:0 0 26px; }
.syslist a{ display:flex; gap:12px; align-items:center; text-decoration:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.syslist a:hover, .syslist a.on{ border-color:var(--c); box-shadow:inset 4px 0 0 var(--c); }
.syslist i{ width:14px; height:14px; border-radius:4px; background:var(--c); flex:none; }
.syslist b{ display:block; line-height:1.2; } .syslist small{ color:var(--muted); }
.tools{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.tools a{ text-decoration:none; background:var(--ink); color:var(--card); border-radius:14px; padding:16px 18px; display:block; }
.tools a:nth-child(2){ background:var(--f); }
.tools a b{ font-family:var(--display); font-size:1.35rem; display:block; }
.tools a span{ opacity:.85; font-size:.95rem; }
.legend{ margin-top:24px; display:flex; flex-wrap:wrap; gap:8px; }

/* insignias AMA */
.ama{ display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:3px 11px 3px 8px; font-weight:700; font-size:.86rem; color:#fff; background:var(--a); white-space:nowrap; }
.ama::before{ content:""; width:9px; height:9px; border-radius:50%; background:#fff; opacity:.9; }
:root[data-theme="dark"] .ama, .dk .ama{ color:#0F1820; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ama{ color:#0F1820; } :root:not([data-theme="light"]) .ama::before{ background:#0F1820; } }

/* página de sistema */
.shead{ border-radius:18px; padding:22px 24px; background:var(--card); border:1px solid var(--line); border-top:10px solid var(--c); margin-bottom:22px; }
.crumbs{ font-size:.92rem; color:var(--muted); margin-bottom:6px; }
.crumbs a{ color:var(--muted); }
.shead h1{ font-size:clamp(2.2rem,5vw,3.4rem); margin:0 0 10px; color:var(--c); }
.shead p.idea{ font-size:1.12rem; max-width:72ch; margin:0 0 12px; }
.shead ul{ margin:0; padding-left:1.1em; color:var(--muted); max-width:80ch; }
.shead ul li{ margin:3px 0; }
.map{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin:0 0 22px; }
.map h2{ font-size:1.6rem; margin:0 0 4px; color:var(--c); }
.map > p{ margin:0 0 10px; color:var(--muted); }
.mrow{ display:grid; grid-template-columns:minmax(150px,230px) 26px minmax(0,1fr) 26px minmax(140px,240px); gap:8px; align-items:center; padding:8px 0; border-top:1px dashed var(--line); }
.map > p + .mrow{ border-top:0; }
.mt{ background:var(--c); color:var(--card); border-radius:10px; padding:8px 12px; line-height:1.2; }
.mt b{ font-family:var(--display); font-size:1.25rem; display:block; }
.mt small{ opacity:.9; }
.arr{ text-align:center; color:var(--c); font-size:1.3rem; font-weight:700; }
.mlinks{ display:flex; flex-wrap:wrap; gap:6px; }
.mlinks a{ text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:4px 12px 4px 8px; background:var(--bg); display:inline-flex; gap:6px; align-items:center; font-weight:600; font-size:.94rem; }
.mlinks a i{ width:10px; height:10px; border-radius:50%; background:var(--a); }
.mlinks a:hover{ border-color:var(--c); }
.mw{ color:var(--muted); font-size:.95rem; }
@media (max-width: 900px){ .mrow{ grid-template-columns:1fr; } .arr{ display:none; } }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
.gcard{ display:flex; flex-direction:column; gap:10px; text-decoration:none; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
.gcard:hover{ border-color:var(--c); }
.gcard h3{ font-size:1.42rem; margin:0; }
.gcard .ex{ color:var(--muted); font-size:.93rem; }
.meters{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.meter small{ display:block; color:var(--muted); font-size:.8rem; margin-bottom:3px; }
.bar5{ display:grid; grid-template-columns:repeat(5,1fr); gap:3px; }
.bar5 i, .bar3 i{ height:9px; border-radius:3px; background:var(--soft); }
.bar3{ display:grid; grid-template-columns:repeat(3,1fr); gap:3px; }
.bar5 i.mid{ background:var(--line); }

/* ficha */
.fhead{ display:grid; grid-template-columns:1fr; gap:4px; margin-bottom:18px; }
.fhead h1{ font-size:clamp(2.2rem,5vw,3.5rem); margin:0; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0; }
.chips span{ background:var(--card); border:1px solid var(--line); border-radius:999px; padding:2px 12px; font-size:.95rem; }
.dials{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:18px 0 24px; }
.dial{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
.dial h3{ font-size:1.05rem; margin:0 0 10px; color:var(--muted); font-family:var(--body); font-weight:700; }
.scale{ position:relative; height:16px; border-radius:8px; background:linear-gradient(90deg, var(--siempre), var(--line) 50%, var(--ok)); margin:8px 0 6px; }
.scale.risk{ background:linear-gradient(90deg, var(--ok), var(--limite) 50%, var(--siempre)); }
.scale b{ position:absolute; top:-6px; width:6px; height:28px; border-radius:3px; background:var(--ink); transform:translateX(-50%); box-shadow:0 0 0 3px var(--card); }
.scale-l{ display:flex; justify-content:space-between; color:var(--muted); font-size:.8rem; }
.dial p{ margin:8px 0 0; font-size:.98rem; }
.cols{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:18px; }
.box{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
.box h2{ font-size:1.5rem; margin:0 0 8px; color:var(--c); }
.box p{ margin:0 0 6px; }
.box ul{ margin:0; padding-left:1.1em; } .box li{ margin:6px 0; }
.todo{ margin-top:18px; background:var(--ink); color:var(--card); border-radius:16px; padding:16px 20px; font-size:1.08rem; }
.todo b.t{ font-family:var(--display); font-size:1.3rem; display:block; margin-bottom:2px; }
.pager{ display:flex; justify-content:space-between; gap:12px; margin-top:26px; flex-wrap:wrap; }
.pager a{ text-decoration:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; max-width:48%; }
.pager small{ display:block; color:var(--muted); }

/* semáforo */
.filters{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 18px; }
.filters button{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; cursor:pointer; font-weight:600; }
.filters button[aria-pressed="true"]{ background:var(--c); color:var(--card); border-color:var(--c); }
.lanes{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.lane{ background:var(--card); border:1px solid var(--line); border-top:8px solid var(--a); border-radius:14px; padding:12px; min-height:200px; }
.lane h3{ font-size:1.2rem; margin:0 0 4px; color:var(--a); }
.lane p{ margin:0 0 10px; color:var(--muted); font-size:.86rem; }
.lane a{ display:block; text-decoration:none; padding:7px 10px; margin:6px 0; border-radius:8px; background:var(--soft); border-left:5px solid var(--c); font-size:.95rem; line-height:1.25; }

/* juego */
.game{ max-width:820px; }
.qcard{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; }
.qcard .sc{ font-family:var(--display); font-size:clamp(1.5rem,3.4vw,2.1rem); line-height:1.15; margin:6px 0 18px; }
.answers{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
.answers button{ text-align:left; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:var(--bg); cursor:pointer; font-weight:700; display:flex; gap:10px; align-items:center; }
.answers button i{ width:14px; height:14px; border-radius:50%; background:var(--a); flex:none; }
.answers button.right{ border-color:var(--ok); background:color-mix(in srgb,var(--ok) 14%,var(--card)); }
.answers button.wrong{ border-color:var(--siempre); background:color-mix(in srgb,var(--siempre) 12%,var(--card)); }
.feedback{ margin-top:16px; padding:12px 16px; border-radius:12px; background:var(--soft); display:none; }
.feedback.show{ display:block; }
.gbar{ display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; color:var(--muted); font-weight:600; flex-wrap:wrap; gap:10px; }
.btn{ background:var(--ink); color:var(--card); border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }

/* fundamentos y dopaje */
.tabs{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; }
.tabs a{ text-decoration:none; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-weight:700; }
.tabs a[aria-current="page"]{ background:var(--f); color:var(--card); border-color:var(--f); }
.flow{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin:14px 0; }
.flow .tg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin-bottom:12px; }
.flow .tg button{ border:0; background:transparent; padding:7px 16px; cursor:pointer; font-weight:700; }
.flow .tg button[aria-pressed="true"]{ background:var(--f); color:var(--card); }
.frow{ display:grid; grid-template-columns:150px 1fr 54px; gap:10px; align-items:center; margin:7px 0; }
.frow .tr{ height:20px; background:var(--soft); border-radius:6px; overflow:hidden; }
.frow .tr i{ display:block; height:100%; background:var(--f); border-radius:6px; transition:width .5s ease; }
.frow b{ text-align:right; font-variant-numeric:tabular-nums; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
table.t{ width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line); }
table.t th, table.t td{ text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid var(--line); font-size:.96rem; }
table.t th{ background:var(--ink); color:var(--card); font-weight:700; }
.tablewrap{ overflow-x:auto; }
.list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:10px 0 16px; }
.list button{ text-align:left; border:1px solid var(--line); border-left:7px solid var(--a); background:var(--card); border-radius:10px; padding:8px 10px; cursor:pointer; line-height:1.2; }
.list button b{ font-family:var(--display); font-size:1.25rem; display:block; }
.list button small{ color:var(--muted); }
.list button[aria-pressed="true"]{ background:color-mix(in srgb,var(--a) 14%,var(--card)); }
.detail{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; min-height:90px; }
footer{ color:var(--muted); font-size:.88rem; margin-top:56px; border-top:1px solid var(--line); padding-top:14px; }

@media (max-width: 900px){
  .hero{ grid-template-columns:1fr; }
  .bodycard{ position:static; max-width:420px; margin:0 auto; }
  .dials{ grid-template-columns:1fr; }
  .cols{ grid-template-columns:1fr; }
  .lanes{ grid-template-columns:1fr; }
  .pager a{ max-width:100%; flex:1 1 100%; }
  .frow{ grid-template-columns:110px 1fr 48px; }
}
@media (max-width: 640px){
  .logo span{ display:none; }
  .topin{ gap:8px; padding:8px 14px; }
  nav.main{ flex-wrap:nowrap; overflow-x:auto; width:100%; -webkit-overflow-scrolling:touch; }
  nav.main a{ white-space:nowrap; padding:6px 10px; }
  .bodycard{ max-width:300px; }
  html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px); }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<header class="top"><div class="topin">
  <a class="logo" href="#inicio"><b>Fármacos y ejercicio</b><span>Farmacología · CAFyD</span></a>
  <nav class="main" aria-label="Secciones">
    <a href="#inicio" data-r="inicio">Cuerpo</a><a href="#semaforo" data-r="semaforo">Semáforo AMA</a><a href="#juego" data-r="juego">¿Permitido?</a><a href="#fund-ladme" data-r="fund">Fundamentos</a><a href="#dopaje" data-r="dopaje">Dopaje</a>
  </nav>
</div></header>
<main id="app" tabindex="-1"></main>
<script>
/* Categorías de la Lista AMA 2026 usadas en el semáforo */
var AMA = {
 ok:      {n:"Permitido", d:"No figura en la Lista de Prohibiciones.", k:"ok"},
 limite:  {n:"Depende de la dosis o la vía", d:"Permitido solo por debajo de una dosis, por debajo de un umbral urinario o por determinadas vías.", k:"limite"},
 comp:    {n:"Prohibido en competición", d:"Prohibido desde las 23:59 h del día anterior a la competición hasta el final del control.", k:"comp"},
 deporte: {n:"Prohibido en deportes concretos", d:"Solo en los deportes en los que mejora el rendimiento.", k:"deporte"},
 siempre: {n:"Prohibido siempre", d:"En competición y fuera de competición.", k:"siempre"}
};

var SIS = {
 sna:{n:"Sistema nervioso autónomo", corto:"SNA", organo:"Nervios autónomos", c:"sna",
  idea:"El ejercicio es una **descarga simpática**: sube la frecuencia cardiaca, se abren los bronquios, se moviliza la glucosa y la sangre se desvía hacia el músculo. Casi todos estos fármacos imitan o bloquean esa respuesta.",
  claves:["**Simpático** (noradrenalina, adrenalina) sobre receptores α y β; **parasimpático** (acetilcolina) sobre receptores muscarínicos.","**β1 = un corazón** (frecuencia y fuerza); **β2 = dos pulmones** (broncodilatación, vasodilatación muscular, glucosa).","Las glándulas sudoríparas son simpáticas pero colinérgicas (M3): un anticolinérgico **quita el sudor** y facilita el golpe de calor."]},
 snc:{n:"Sistema nervioso central", corto:"SNC", organo:"Cerebro", c:"snc",
  idea:"El cerebro decide **cuándo parar**. Los fármacos que cambian la percepción de la fatiga son los más ergogénicos y los más peligrosos. Casi todos los demás psicofármacos están permitidos, pero ninguno es neutro.",
  claves:["Prohibidos en competición: **estimulantes** (S6), **narcóticos** (S7) y **cannabinoides** (S8).","Permitidos, pero con impacto: antidepresivos, ansiolíticos, antiepilépticos, antipsicóticos y antiparkinsonianos.","No prohibido no significa sin consecuencias: vigilancia, coordinación, sueño, peso y **termorregulación**."]},
 dolor:{n:"Dolor e inflamación", corto:"Dolor", organo:"Músculos y articulaciones", c:"dolor",
  idea:"El dolor es una **señal** y la inflamación forma parte de la **reparación**. Silenciarlos tiene un precio en el riñón, el estómago o el tendón, y algunos analgésicos están prohibidos en competición.",
  claves:["Los **AINE** actúan en la lesión (prostaglandinas); los **opioides**, en la médula; el **paracetamol**, sobre todo en el cerebro.","Nada de antiinflamatorios **«por si acaso»** antes de una prueba larga.","Corticoides inyectables y opioides (también el tramadol): **prohibidos en competición**."]},
 cv:{n:"Cardiovascular y riñón", corto:"Cardiovascular", organo:"Corazón, vasos y riñón", c:"cv",
  idea:"**PA = gasto cardiaco × resistencia periférica.** Cada fármaco actúa sobre el volumen, el corazón o los vasos, y eso cambia la frecuencia cardiaca, la presión, la hidratación y la seguridad durante la sesión.",
  claves:["Antes de programar una sesión: **¿qué toma y qué cambia eso** en la FC, la PA, la hidratación y la seguridad?","Con betabloqueantes, verapamilo o diltiazem, la FC deja de servir: **intensidad por esfuerzo percibido**.","Diuréticos: **prohibidos siempre** (S5). Betabloqueantes: prohibidos en **deportes de precisión** (P1)."]},
 resp:{n:"Respiratorio", corto:"Respiratorio", organo:"Pulmones", c:"resp",
  idea:"El tono bronquial lo deciden el **parasimpático** (cierra, receptores M3) y la **adrenalina** (abre, receptores β2), sobre un fondo de inflamación. **Broncodilatar alivia; desinflamar controla.**",
  claves:["Asma: obstrucción **reversible** e inflamatoria. EPOC: obstrucción **poco reversible**, ligada al tabaco.","La vía **inhalada** pone el fármaco donde hace falta con mínimos efectos sistémicos.","Los β2 inhalados están permitidos **hasta una dosis máxima**; por encima, o por vía oral, hace falta AUT."]},

   ["Metabolismo","La más frecuente. **Inductores** (rifampicina, carbamazepina, hipérico) bajan los niveles; **inhibidores** (claritromicina, azoles, ritonavir, pomelo) los suben."],
   ["Excreción","Competencia por la secreción tubular (probenecid + penicilina) y cambios del pH urinario."],
   ["Cascada terapéutica","Un efecto adverso se interpreta como una enfermedad nueva y se trata con otro fármaco, que añade nuevos efectos adversos."]
  ].map(function(x){ return '<div class="box"><h2>'+x[0]+'</h2><p>'+md(x[1])+'</p></div>'; }).join("")+'</div><div class="todo"><b class="t">Del laboratorio al control antidopaje</b>Un deportista con corticoide inhalado empieza claritromicina por una infección: el macrólido inhibe el CYP3A4, suben los niveles del corticoide y puede aparecer en orina por encima de lo esperado.</div>';
 }}
};
function fund(k){
  var F = FUND[k]; if(!F) return nf();
  var h = '<div style="--c:var(--f)"><div class="crumbs"><a href="#inicio">Cuerpo</a> › Fundamentos</div><h1 style="font-size:clamp(2.2rem,5vw,3.4rem);margin:0 0 12px;color:var(--f)">'+F.n+'</h1><nav class="tabs" aria-label="Fundamentos">';
  Object.keys(FUND).forEach(function(x){ h += '<a href="#fund-'+x+'"'+(x===k?' aria-current="page"':'')+'>'+FUND[x].n+'</a>'; });
  return h+'</nav>'+md(F.html()).replace(/&lt;/g,"<")+foot()+'</div>';
}
function wireFund(k){
  if(k!=="ladme") return;
  var bars = document.getElementById("bars");
  function draw(m){ bars.innerHTML = FLOW.map(function(f){ return '<div class="frow"><span>'+f[0]+'</span><div class="tr"><i style="width:'+f[m]+'%"></i></div><b>'+f[m]+' %</b></div>'; }).join(""); }
  draw(1);
  Array.prototype.forEach.call(document.querySelectorAll(".tg button"), function(b){ b.addEventListener("click", function(){ Array.prototype.forEach.call(document.querySelectorAll(".tg button"), function(x){ x.setAttribute("aria-pressed","false"); }); b.setAttribute("aria-pressed","true"); draw(+b.getAttribute("data-m")); }); });
}

/* ---------- dopaje ---------- */
var LISTA = [
 ["S0","No aprobadas","siempre","Sustancias sin aprobación para uso humano (fármacos en investigación, veterinarios). Prohibidas siempre."],
 ["S1","Agentes anabolizantes","siempre","Testosterona, nandrolona, SARM y **clenbuterol** (aunque sea un β2, se clasifica aquí por su efecto anabolizante): masa y fuerza. Virilización, daño cardiaco, hipogonadismo."],
 ["S2","Hormonas peptídicas y factores de crecimiento","siempre","**EPO** y activadores del HIF (más oxígeno, más hematocrito, más trombosis), hormona del crecimiento e IGF-1."],
 ["S3","Beta-2 agonistas","limite","Prohibidos siempre, salvo **salbutamol, formoterol, salmeterol y vilanterol inhalados** por debajo de su dosis máxima."],
 ["S4","Moduladores hormonales y metabólicos","siempre","Antiestrógenos, inhibidores de la aromatasa, **insulina** (un diabético necesita AUT), meldonio, trimetazidina."],
 ["S5","Diuréticos y enmascarantes","siempre","Todos los diuréticos, desmopresina, probenecid y expansores del plasma: para perder peso y para ocultar otras sustancias."],
 ["S6","Estimulantes","comp","Anfetaminas, cocaína, metilfenidato, modafinilo; efedrina y pseudoefedrina por encima de su umbral. La cafeína está permitida."],
 ["S7","Narcóticos","comp","Morfina, fentanilo, oxicodona, metadona, **tramadol** (desde 2024)."],
 ["S8","Cannabinoides","comp","THC (umbral 150 ng/mL). El CBD puro está permitido."],
 ["S9","Glucocorticoides","comp","Prohibidos en competición por vía oral, rectal e **inyectable** (también infiltraciones). Inhalados y tópicos, permitidos."],
 ["P1","Betabloqueantes","deporte","Tiro con arco, tiro y subacuáticas (siempre); automovilismo, billar, dardos, golf y minigolf (en competición)."],
 ["M1","Manipulación de la sangre","siempre","Transfusiones (también autotransfusión) y, desde 2026, la extracción de sangre fuera de los supuestos clínicos."],
 ["M2","Manipulación química y física","siempre","Manipular la muestra; infusiones IV de más de 100 mL en 12 h sin justificación clínica."],
 ["M3","Dopaje genético y celular","siempre","Edición genética y uso de células o componentes celulares (desde 2026, también mitocondrias) para mejorar el rendimiento."]
];
function dopaje(){
  var h = '<div style="--c:var(--siempre)"><div class="crumbs"><a href="#inicio">Cuerpo</a> › Dopaje</div><h1 style="font-size:clamp(2.2rem,5vw,3.4rem);margin:0 0 8px">Dopaje y Lista de Prohibiciones</h1><p class="lead" style="color:var(--muted);max-width:74ch;margin:0 0 16px">El dopaje es una categoría **jurídica**, no farmacológica: el Código Mundial Antidopaje recoge 11 infracciones y solo una exige un positivo. Pulsa cada sección de la Lista 2026.</p>'.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  h += '<div class="list">'+LISTA.map(function(l,i){ return '<button type="button" data-i="'+i+'" style="--a:'+cv(l[2])+'" aria-pressed="'+(i===0)+'"><b>'+l[0]+'</b><small>'+l[1]+'</small></button>'; }).join("")+'</div><div class="detail" id="det" aria-live="polite"></div>';
  h += '<div class="grid2" style="margin-top:18px">'+[
   ["Por qué entra una sustancia","Basta con **dos de tres criterios**: mejora el rendimiento, supone un riesgo para la salud o vulnera el espíritu del deporte. También entra si puede enmascarar otras."],
   ["Responsabilidad objetiva","Cada deportista responde de lo que aparece en su organismo, venga de donde venga. La intención gradúa la sanción, no la existencia de la infracción: un **suplemento contaminado** puede acabar en sanción."],
   ["AUT: cuatro condiciones","Enfermedad diagnosticada que requiere el fármaco; no mejora el rendimiento más allá de devolver la salud; no hay alternativa permitida razonable; y la necesidad no viene de un uso previo sin AUT. Se pide con antelación (en España, a la CELAD)."],
   ["Umbral no es dosis permitida","Salvo en los β2 inhalados, el umbral urinario separa la exposición plausible de la que no lo es. La mayoría de las sustancias no tienen umbral: cualquier cantidad es un resultado analítico adverso."],
   ["Suplementos","Entre un 10 y un 30 % pueden estar contaminados o adulterados (estimulantes, prohormonas). Mejor alimentación primero, productos con certificación de terceros y guardar el lote."],
   ["Antes de recomendar, consulta","**NoDopApp** (medicamentos en España), Global DRO y la Lista de la AMA, que cambia cada 1 de enero. Tú también eres «personal de apoyo»: puedes cometer infracciones."]
  ].map(function(x){ return '<div class="box"><h2>'+x[0]+'</h2><p>'+md(x[1])+'</p></div>'; }).join("")+'</div>';
  return h+foot()+'</div>';
}
function wireDop(){
  var det = document.getElementById("det");
  function show(i){ var l = LISTA[i]; det.style.borderLeft = "8px solid "+cv(l[2]); det.innerHTML = '<h2 style="margin:0 0 6px;font-size:1.6rem">'+l[0]+'. '+l[1]+'</h2>'+badge(l[2])+'<p style="margin:10px 0 0">'+md(l[3])+'</p>';
    Array.prototype.forEach.call(document.querySelectorAll(".list button"), function(b){ b.setAttribute("aria-pressed", +b.getAttribute("data-i")===i); }); }
  show(0);
  Array.prototype.forEach.call(document.querySelectorAll(".list button"), function(b){ b.addEventListener("click", function(){ show(+b.getAttribute("data-i")); }); });
}

function nf(){ return '<p>Esa página no existe. Vuelve al <a href="#inicio">cuerpo</a>.</p>'; }

/* ---------- enrutado ---------- */
function render(keep){
  var r = (location.hash||"#inicio").slice(1) || "inicio", h, nav = r, m;
  if(r==="inicio"){ h = home(); }
  else if((m=/^sis-(\w+)$/.exec(r))){ h = sistema(m[1]); nav="inicio"; }
  else if((m=/^g-([\w-]+)$/.exec(r))){ h = ficha(m[1]); nav="inicio"; }
  else if(r==="semaforo"){ h = semaforo(); }
  else if(r==="juego"){ h = juego(); }
  else if((m=/^fund-(\w+)$/.exec(r))){ h = fund(m[1]); nav="fund"; }
  else if(r==="dopaje"){ h = dopaje(); }
  else { h = home(); nav="inicio"; r="inicio"; }
  app.innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll("nav.main a"), function(a){ if(a.getAttribute("data-r")===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(r==="inicio") wireHome();
  if(r==="semaforo") wireSem();
  if(r==="juego") wireJuego();
  if(m && r.indexOf("fund-")===0) wireFund(m[1]);
  if(r==="dopaje") wireDop();
  if(!keep) window.scrollTo(0,0);
}
window.addEventListener("hashchange", function(){ render(); });
render();
})();
</script>
